<script>
(function () {
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const set = () => document.querySelectorAll('link[rel="icon"]').forEach((l) => {
    l.href = l.getAttribute('href').replace(/icon-(light|dark)/, dark.matches ? 'icon-dark' : 'icon-light');

  set();
  if (dark.addEventListener) dark.addEventListener('change', set);
})();

<style>
/* Bento, as Jeremy picked it on 2026-11-06: rounded tiles in two sizes, follows the phone's dark or light setting,
   initials, his own line, each build with a line and a picture, and a LinkedIn-blue button with a white logo.
   The security print extras (rosette, wave band, UV lamp, UV flare) come from the SQL Lab and are switched on
   by data-extras on <html>; data-word and data-tone set what the print says and the line color.
   His picks: rosette, wave band and UV lamp, the print says JS and his name, lines in black and white. */
:root{
  color-scheme:light dark;
  --f:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F0F0EC;--tile:#FFFFFF;--line:#E2E2DD;--tx:#121212;--tx2:#67676A;--chip:#F0F0EC;
  --av:#121212;--avt:#FFFFFF;--goa:#FFFFFF;--hover:#C9C9C3;
  --li:#0A66C2;--li-hover:#0958A8;
  --uv-blend:multiply;--uv-wash:rgba(112,64,255,.2);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090A;--tile:#161618;--line:#242427;--tx:#F4F4F5;--tx2:#9C9CA3;--chip:#232326;
  --av:#F4F4F5;--avt:#09090A;--goa:#232326;--hover:#3C3C42;
  --uv-blend:screen;--uv-wash:rgba(112,64,255,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 var(--f)}
.page{position:relative;max-width:440px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.page{padding-top:56px;padding-bottom:56px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--tile);border:1px solid var(--line);border-radius:22px;overflow:hidden;color:inherit;text-decoration:none}
.wide{grid-column:1 / -1}
.me{flex-direction:row;align-items:center;gap:14px;padding:16px}
.me > :not(.gl){position:relative;z-index:1}
.av{flex:none;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--av);color:var(--avt);font:600 21px/1 var(--f);letter-spacing:-.02em}
h1{margin:0;font:600 21px/1.15 var(--f);letter-spacing:-.02em}
.line{margin:3px 0 0;font-size:14.5px;color:var(--tx2)}
.shot{display:block;width:100%;height:auto;aspect-ratio:1280/760;object-fit:cover}
.half .shot{aspect-ratio:1/1}
.cap{display:grid;gap:3px;padding:12px 14px 14px}
.t{font:600 16px/1.2 var(--f);letter-spacing:-.01em}
.d{font-size:13px;line-height:1.35;color:var(--tx2)}
.chip{justify-self:start;margin-top:6px;padding:4px 9px;border-radius:999px;background:var(--chip);font:500 12px/1.2 var(--f);color:var(--tx2)}
.go{position:absolute;right:10px;top:10px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--goa);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.go svg{width:16px;height:16px}
.li{justify-content:space-between;gap:16px;padding:14px;min-height:150px;background:var(--li);border-color:var(--li);color:#FFFFFF}
.li .go{position:static}
.lih{display:flex;justify-content:space-between;align-items:flex-start}
.li-ic{display:block;width:46px;height:46px;fill:#FFFFFF}
.lit{font:600 16px/1.2 var(--f)}
a.tile{transition:border-color .15s ease,transform .15s ease,background-color .15s ease}
a.tile:hover{border-color:var(--hover);transform:translateY(-1px)}
a.li:hover{background:var(--li-hover);border-color:var(--li-hover)}
a.tile:active{transform:scale(.99)}
a.tile:focus-visible{outline:3px solid var(--tx);outline-offset:3px}

/* Security print from the SQL Lab: rosette, wave band, UV lamp and UV flare */
.gl{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.gl canvas{position:absolute;left:88%;top:50%;translate:-50% -50%}
.gl-a{animation:spin 340s linear infinite}
.gl-b{animation:spin 520s linear infinite reverse}
@keyframes spin{to{rotate:360deg}}
.weave{position:relative;height:34px;margin-top:16px;overflow:hidden;pointer-events:none;opacity:.75}
.weave i{position:absolute;inset:0 -240px 0 0;background:var(--weave) repeat-x 0 50%/240px 34px;animation:drift 46s linear infinite}
@keyframes drift{to{translate:-240px 0}}
.lamp{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;opacity:0;transition:opacity .45s ease;mix-blend-mode:var(--uv-blend);-webkit-mask-image:radial-gradient(circle 130px at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.72) 40%,transparent 100%);mask-image:radial-gradient(circle 130px at var(--mx,50%) var(--my,50%),#000 0,rgba(0,0,0,.72) 40%,transparent 100%)}
.lamp.on{opacity:1}
.lamp canvas{position:absolute;left:var(--lx,50%);top:var(--ly,50%);translate:-50% -50%}
.flare{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:6;mix-blend-mode:var(--uv-blend)}
.flare canvas{position:absolute;left:var(--px);top:var(--py);translate:-50% -50%}
.flare i{position:absolute;inset:0;background:radial-gradient(circle 420px at var(--px) var(--py),var(--uv-wash),transparent 72%)}
@media (prefers-reduced-motion:reduce){
  a.tile{transition:none}a.tile:hover,a.tile:active{transform:none}
  .gl-a,.gl-b,.weave i{animation:none}
}
</style>
</head>

        <span class="go" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.5 11.5l7-7M6 4.5h5.5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

<script>
/* The security print, ported from the Kenari Collection SQL Lab (assets/js/app/ui.js). Without JavaScript the page is the same, minus the print. */
(function () {
  'use strict';
  const root = document.documentElement;
  const page = document.querySelector('.page');
  const TAU = Math.PI * 2;
  /* Each band: curves, base radius, wave depth, waves, second depth, second waves, phase drift, strength */
  const LACE = [[18, 0.12, 0.075, 9, 0, 0, 0, 0.8], [27, 0.3, 0.07, 9, 0.022, 27, 1, 0.95], [36, 0.5, 0.095, 12, 0.03, 36, 1, 1], [48, 0.74, 0.1, 16, 0.03, 48, 1, 1], [64, 0.93, 0.035, 32, 0, 0, 0, 0.75]];
  const FINE = [[12, 0.1, 0.07, 6, 0, 0, 0, 1], [24, 0.27, 0.09, 12, 0, 0, 0, 1], [32, 0.48, 0.11, 16, 0, 0, 0, 1], [40, 0.76, 0.13, 20, 0, 0, 0, 1]];
  /* Line color and the strength of the two rosette layers */
  const TONE = {
    neutral: { light: ['18,18,18', 0.085, 0.065], dark: ['244,244,245', 0.1, 0.085] },
    teal: { light: ['9,84,84', 0.2, 0.13], dark: ['127,214,196', 0.15, 0.14] }
  };
  const UV = { light: '86,32,208', dark: '168,132,255' };
  const WORDS = {
    sesuai: { inner: 'SESUAI ', middle: 'KENARI SQL LAB · KENARI EXCEL LAB · ', big: 'SESUAI' },
    js: { inner: 'JEREMY SUBIAKTO · ', middle: 'I BUILT STUFF (SOMETIMES) · ', big: 'JS' }
  };
  const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const has = (x) => (' ' + (root.dataset.extras || '') + ' ').indexOf(' ' + x + ' ') >= 0;
  const tone = () => (TONE[root.dataset.tone] || TONE.neutral)[isDark() ? 'dark' : 'light'];
  const words = () => WORDS[root.dataset.word] || WORDS.sesuai;
  const idle = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 1200 }) : setTimeout(fn, 150));

  function rosette(cv, size, rgb, alpha, opts) {
    const o = opts || {};
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.height = Math.round(size * dpr);
    cv.style.width = cv.style.height = size + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, size / 2 * dpr, size / 2 * dpr);
    const R = size / 2 * 0.985;
    c.lineWidth = 0.5;
    c.globalCompositeOperation = o.add ? 'lighter' : 'source-over';
    (o.recipe || LACE).forEach((b) => {
      c.strokeStyle = 'rgba(' + rgb + ',' + (alpha * b[7]) + ')';
      const steps = Math.max(420, Math.max(b[3], b[5]) * 12);
      for (let k = 0; k < b[0]; k++) {
        const ph = k / b[0] * TAU + (o.phase || 0);
        c.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps * TAU;
          const r = R * (b[1] + b[2] * Math.cos(b[3] * t + ph) + b[4] * Math.cos(b[5] * t - b[6] * ph));
          if (i) c.lineTo(r * Math.cos(t), r * Math.sin(t)); else c.moveTo(r * Math.cos(t), r * Math.sin(t));
        }
        c.closePath();
        c.stroke();
      }
    });
    return c;
  }
  /* Microprint: the text repeated round a circle, in narrowed capitals */
  function ring(c, text, r, px) {
    c.save();
    c.font = '700 ' + px + 'px Geist, system-ui, sans-serif';
    const sx = 0.82;
    const gap = px * 0.1;
    const adv = Array.from(text).map((ch) => c.measureText(ch).width * sx + gap);
    const total = adv.reduce((a, b) => a + b, 0);
    const reps = Math.max(1, Math.floor(TAU * r / total));
    const k = TAU * r / (reps * total);
    let s = 0;
    for (let q = 0; q < reps; q++) {
      Array.from(text).forEach((ch, i) => {
        const a = adv[i] * k;
        c.save();
        c.rotate((s + a / 2) / r);
        c.translate(0, -r);
        c.scale(sx, 1);
        c.fillText(ch, -c.measureText(ch).width / 2, 0);
        c.restore();
        s += a;
      });
    }
    c.restore();
  }
  /* The hidden UV print: a violet rosette, three rings of microprint and the big word */
  function uvPrint(cv, size) {
    const dark = isDark();
    const rgb = UV[dark ? 'dark' : 'light'];
    const c = rosette(cv, size, rgb, dark ? 0.62 : 0.5, { add: dark, phase: 0.6 });
    const R = size / 2 * 0.985;
    const w = words();
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = 'rgb(' + rgb + ')';
    c.globalAlpha = 0.85;
    ring(c, w.inner, R * 0.505, size * 0.0316);
    ring(c, w.middle, R * 0.74, size * 0.021);
    ring(c, w.inner, R * 0.3, size * 0.0263);
    c.globalAlpha = 0.9;
    c.save();
    c.font = '700 ' + Math.round(R * (w.big.length > 3 ? 0.29 : 0.42)) + 'px Geist, system-ui, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.scale(0.86, 1);
    c.fillText(w.big, 0, R * 0.02);
    c.restore();
    c.globalAlpha = 1;
    return c;
  }
  function weaveURI(rgb) {
    const w = 240, h = 36, strands = 7;
    let out = '';
    for (let k = 0; k < strands; k++) {
      const ph = k / strands * TAU;
      let d = '';
      for (let x = 0; x <= w; x += 3) {
        const y = h / 2 + (h / 2 - 1) * (0.72 * Math.sin(TAU * 4 * x / w + ph) + 0.28 * Math.sin(TAU * 12 * x / w - 2 * ph));
        d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(2);
      }
      out += '<path d="' + d + '"/>';
    }
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><g fill="none" stroke="rgb(' + rgb + ')" stroke-opacity=".6" stroke-width=".7">' + out + '</g></svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }

  let undo = [];
  function clear() { undo.forEach((f) => f()); undo = []; }
  function setupRosette() {
    const host = document.querySelector('.me .gl');
    const a = document.createElement('canvas');
    const b = document.createElement('canvas');
    a.className = 'gl-a';
    b.className = 'gl-b';
    host.append(a, b);
    const t = tone();
    const dark = isDark();
    idle(() => {
      rosette(a, 320, t[0], t[1], { add: dark });
      rosette(b, 320, t[0], t[2], { add: dark, recipe: FINE, phase: 0.21 });
    });
    undo.push(() => { a.remove(); b.remove(); });
  }
  function setupWeave() {
    const band = document.querySelector('.weave');
    root.style.setProperty('--weave', weaveURI(tone()[0]));
    band.hidden = false;
    undo.push(() => { band.hidden = true; });
  }
  function setupLamp() {
    const grid = document.querySelector('.grid');
    const lamp = document.createElement('div');
    lamp.className = 'lamp';
    lamp.setAttribute('aria-hidden', 'true');
    const cv = document.createElement('canvas');
    lamp.append(cv);
    page.append(lamp);
    const size = Math.round(Math.max(grid.offsetWidth, grid.offsetHeight) * 1.15);
    lamp.style.setProperty('--lx', (grid.offsetLeft + grid.offsetWidth / 2) + 'px');
    lamp.style.setProperty('--ly', (grid.offsetTop + grid.offsetHeight / 2) + 'px');
    let drawn = false;
    const draw = () => { if (!drawn) { drawn = true; uvPrint(cv, size); } };
    document.fonts.ready.then(() => idle(draw));
    let timer = 0;
    const show = (x, y) => {
      draw();
      const r = page.getBoundingClientRect();
      lamp.style.setProperty('--mx', (x - r.left) + 'px');
      lamp.style.setProperty('--my', (y - r.top) + 'px');
      lamp.classList.add('on');
      clearTimeout(timer);
      timer = setTimeout(() => lamp.classList.remove('on'), 900);
    };
    const onPointer = (e) => { if (e.pointerType === 'mouse' || e.pointerType === 'pen') show(e.clientX, e.clientY); };
    const onTouch = (e) => { const t = e.touches[0]; if (t) show(t.clientX, t.clientY); };
    document.addEventListener('pointermove', onPointer);
    document.addEventListener('touchstart', onTouch, { passive: true });
    document.addEventListener('touchmove', onTouch, { passive: true });
    undo.push(() => {
      document.removeEventListener('pointermove', onPointer);
      document.removeEventListener('touchstart', onTouch);
      document.removeEventListener('touchmove', onTouch);
      clearTimeout(timer);
      lamp.remove();
    });
  }
  /* The UV flare from the SQL Lab's stamp, here bursting from the initials */
  function playFlare() {
    if (calm()) return;
    const av = document.querySelector('.av').getBoundingClientRect();
    const u = document.createElement('div');
    u.className = 'flare';
    u.setAttribute('aria-hidden', 'true');
    u.style.setProperty('--px', (av.left + av.width / 2) + 'px');
    u.style.setProperty('--py', (av.top + av.height / 2) + 'px');
    const cv = document.createElement('canvas');
    uvPrint(cv, 760);
    u.append(document.createElement('i'), cv);
    document.body.append(u);
    u.animate([{ opacity: 0 }, { opacity: 1, offset: 0.05 }, { opacity: 0.8, offset: 0.26 }, { opacity: 0 }], { duration: 1500, easing: 'ease-out' });
    cv.animate([{ transform: 'scale(.85) rotate(-5deg)' }, { transform: 'scale(1.05) rotate(4deg)' }], { duration: 1500, easing: 'cubic-bezier(.1,.75,.2,1)' });
    setTimeout(() => u.remove(), 1560);
  }
  function apply() {
    clear();
    if (has('rosette')) setupRosette();
    if (has('weave')) setupWeave();
    if (has('lamp')) setupLamp();
  }
  apply();
  if (has('flare')) document.fonts.ready.then(() => setTimeout(playFlare, 350));
  const scheme = matchMedia('(prefers-color-scheme: dark)');
  if (scheme.addEventListener) scheme.addEventListener('change', apply);
  window.LinkExtras = { apply, playFlare };
})();
</script>
